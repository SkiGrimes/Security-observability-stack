services:
  sample-app:
    build: ./app
    container_name: hcl-sample-app
    ports:
      - "8080:8080"
    networks:
      - lab-net

  prometheus:
    image: prom/prometheus:latest
    container_name: hcl-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - lab-net

  grafana:
    image: grafana/grafana:latest
    container_name: hcl-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    networks:
      - lab-net
    depends_on:
      - prometheus

  node-exporter:
    image: prom/node-exporter:latest
    container_name: hcl-node-exporter
    ports:
      - "9100:9100"
    networks:
      - lab-net

networks:
  lab-net:
    driver: bridge
